name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR exige minusculas
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  compile:
    name: 1 · Compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Unit + e2e con mocks (sin DB). Si falla, no se despliega.
      - name: Tests
        run: npm test -- --ci

      - name: Compilar NestJS
        run: npm run build

      - name: Resumen
        if: always()
        run: |
          {
            echo "## 1 · Compilar"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Compilación OK — sigue build de imagen / deploy"
            else
              echo "❌ Falló la compilación. Revisá los logs del step **Compilar NestJS**."
              echo ""
              echo "El deploy **no** se ejecuta si esta etapa falla."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-image:
    name: 2 · Build imagen (GHCR)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Si falla, el fallback puede recuperar el deploy
    continue-on-error: true
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      ok: ${{ steps.signal.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: |
          set -euo pipefail
          name="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          tag="${name}:sha-${GITHUB_SHA}"
          latest="${name}:latest"
          echo "api_image=${tag}" >> "$GITHUB_OUTPUT"
          echo "api_image_latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Imagen: ${tag}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ steps.meta.outputs.api_image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Marcar OK
        id: signal
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## 2 · Build imagen (GHCR)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Imagen publicada: \`${{ steps.meta.outputs.api_image }}\`"
              echo ""
              echo "Siguiente: pull + **blue/green** en Lightsail (sin cortar tráfico)."
            else
              echo "❌ Falló el build/push a GHCR."
              echo ""
              echo "Se intentará el **fallback**: build Docker directo en Lightsail (método anterior)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-registry:
    name: 3 · Deploy Lightsail (pull GHCR)
    needs: [compile, build-image]
    if: needs.build-image.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Si el pull falla, el job 4 (fallback) puede completar el deploy
    continue-on-error: true
    outputs:
      ok: ${{ steps.signal.outputs.ok }}
    steps:
      - name: Esperar puerto 22 de Lightsail
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "::error title=Deploy Backend::Falta el secret LIGHTSAIL_HOST"
            exit 1
          fi
          for i in $(seq 1 8); do
            if timeout 12 bash -c "echo >/dev/tcp/${HOST}/22" 2>/dev/null; then
              echo "Puerto 22 OK (intento ${i})"
              exit 0
            fi
            echo "Intento ${i}/8: no responde :22. Reintento en 20s."
            sleep 20
          done
          echo "::error title=Deploy Backend::GitHub no llega al puerto 22 de Lightsail. Revisá: instancia encendida, IP pública = LIGHTSAIL_HOST, firewall IPv4 con SSH 22 abierto a 0.0.0.0/0 (los runners cambian de IP), y que un docker build cortado no haya dejado la máquina sin RAM. Si hace falta, reiniciá la instancia y volvé a correr este workflow."
          exit 1

      - name: Pull imagen GHCR y blue/green
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.build-image.outputs.api_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          timeout: 2m
          command_timeout: 20m
          script_stop: true
          envs: API_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            export COMPOSE_BAKE=0
            export DOCKER_BUILDKIT=1

            die() {
              echo "::error title=Deploy Backend::$1"
              exit 1
            }

            echo "========================================"
            echo "Deploy Backend — pull GHCR + blue/green"
            echo "========================================"

            # appleboy inyecta envs; validar antes de tocar el servidor.
            API_IMAGE="${API_IMAGE:-}"
            if [ -z "${API_IMAGE}" ] || ! echo "${API_IMAGE}" | grep -q '^ghcr.io/'; then
              die "API_IMAGE vacía o inválida (${API_IMAGE:-<vacía>}). ¿Falló el job Build imagen?"
            fi
            export API_IMAGE
            echo "API_IMAGE=${API_IMAGE}"

            echo ""
            echo ">>> [1/5] Ir al directorio de la app"
            cd /opt/crc || die "No existe /opt/crc en el servidor"

            echo ""
            echo ">>> [2/5] Actualizar código (git pull main)"
            if [ -d "/opt/crc/api/.git" ]; then
              cd /opt/crc/api
              git fetch origin main || die "git fetch falló"
              git reset --hard origin/main || die "git reset falló"
              echo "Commit: $(git rev-parse --short HEAD)"
            else
              rm -rf /opt/crc/api
              git clone --branch main https://github.com/nicoperez97/cash-register-closings-api.git /opt/crc/api \
                || die "git clone falló"
            fi

            cd /opt/crc
            cp api/docker-compose.yml . || die "No se pudo copiar docker-compose.yml"
            mkdir -p nginx
            if [ -d api/nginx ]; then
              cp -r api/nginx/. ./nginx/ || die "No se pudo copiar nginx/"
            fi
            [ -f nginx/upstream.conf ] || die "Falta nginx/upstream.conf"
            [ -f api/scripts/deploy-blue-green.sh ] || die "Falta scripts/deploy-blue-green.sh"
            # Si .env local pisaba la imagen con crc-api, forzar la de GHCR en el deploy.
            if [ -f .env ]; then
              grep -v '^API_IMAGE=' .env > .env.deploy-tmp || true
              mv .env.deploy-tmp .env
            fi
            echo "API_IMAGE=${API_IMAGE}" >> .env

            echo ""
            echo ">>> [3/5] Login GHCR + pull imagen"
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin \
              || die "docker login ghcr.io falló"
            sudo docker pull "${API_IMAGE}" || die "docker pull ${API_IMAGE} falló"

            echo ""
            echo ">>> [4/5] Blue/green (vieja sigue hasta health de la nueva)"
            bash api/scripts/deploy-blue-green.sh || die "deploy-blue-green.sh falló"

            echo ""
            echo ">>> [5/5] Logout GHCR"
            sudo docker logout ghcr.io >/dev/null 2>&1 || true

            echo ""
            echo "========================================"
            echo "Deploy Backend OK (GHCR + blue/green)"
            echo "========================================"

      - name: Marcar OK
        id: signal
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## 3 · Deploy Lightsail (pull GHCR)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Imagen \`${{ needs.build-image.outputs.api_image }}\` desplegada con **blue/green** (sin cortar la API vieja hasta health)."
            else
              echo "❌ Falló el deploy por pull GHCR."
              echo ""
              echo "Se intentará el **fallback**: build Docker en el servidor."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-fallback:
    name: 4 · Deploy Lightsail (fallback build local)
    needs: [compile, build-image, deploy-registry]
    if: |
      always()
      && needs.compile.result == 'success'
      && needs.deploy-registry.outputs.ok != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      ok: ${{ steps.signal.outputs.ok }}
    steps:
      - name: Esperar puerto 22 de Lightsail
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "::error title=Deploy Backend::Falta el secret LIGHTSAIL_HOST"
            exit 1
          fi
          for i in $(seq 1 8); do
            if timeout 12 bash -c "echo >/dev/tcp/${HOST}/22" 2>/dev/null; then
              echo "Puerto 22 OK (intento ${i})"
              exit 0
            fi
            echo "Intento ${i}/8: no responde :22. Reintento en 20s."
            sleep 20
          done
          echo "::error title=Deploy Backend::GitHub no llega al puerto 22 de Lightsail. Revisá: instancia encendida, IP pública = LIGHTSAIL_HOST, firewall IPv4 con SSH 22 abierto a 0.0.0.0/0 (los runners cambian de IP), y que un docker build cortado no haya dejado la máquina sin RAM. Si hace falta, reiniciá la instancia y volvé a correr este workflow."
          exit 1

      - name: Build local + blue/green
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          timeout: 2m
          command_timeout: 50m
          script_stop: true
          script: |
            set -euo pipefail
            export COMPOSE_BAKE=0
            export DOCKER_BUILDKIT=1
            # Forzar build local (sin GHCR)
            unset API_IMAGE || true

            die() {
              echo "::error title=Deploy Backend::$1"
              exit 1
            }

            echo "========================================"
            echo "Deploy Backend — fallback build + blue/green"
            echo "========================================"

            echo ""
            echo ">>> [1/5] Ir al directorio de la app"
            cd /opt/crc || die "No existe /opt/crc en el servidor"

            echo ""
            echo ">>> [2/5] Actualizar código (git pull main)"
            if [ -d "/opt/crc/api/.git" ]; then
              cd /opt/crc/api
              git fetch origin main || die "git fetch falló"
              git reset --hard origin/main || die "git reset falló"
              echo "Commit: $(git rev-parse --short HEAD)"
            else
              rm -rf /opt/crc/api
              git clone --branch main https://github.com/nicoperez97/cash-register-closings-api.git /opt/crc/api \
                || die "git clone falló"
            fi

            cd /opt/crc
            cp api/docker-compose.yml . || die "No se pudo copiar docker-compose.yml"
            mkdir -p nginx
            if [ -d api/nginx ]; then
              cp -r api/nginx/. ./nginx/ || die "No se pudo copiar nginx/"
            fi
            [ -f api/scripts/deploy-blue-green.sh ] || die "Falta scripts/deploy-blue-green.sh"

            echo ""
            echo ">>> [3/5] Build imagen Docker (api-blue/green) en el servidor"
            sudo COMPOSE_BAKE=0 DOCKER_BUILDKIT=1 docker compose build api-blue api-green \
              || die "docker compose build falló — revisá el Dockerfile / logs de build"

            echo ""
            echo ">>> [4/5] Blue/green"
            bash api/scripts/deploy-blue-green.sh || die "deploy-blue-green.sh falló"

            echo ""
            echo ">>> [5/5] Listo"
            echo "========================================"
            echo "Deploy Backend OK (fallback + blue/green)"
            echo "========================================"

      - name: Marcar OK
        id: signal
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## 4 · Deploy Lightsail (fallback build local)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Fallback OK: build en Lightsail + **blue/green**."
              echo ""
              echo "El camino rápido (GHCR) falló o se saltó; producción igual quedó actualizada."
            else
              echo "❌ Falló también el fallback."
              echo ""
              echo "Si el error es \`dial tcp :22: i/o timeout\`, GitHub no llega a Lightsail."
              echo "1. Instancia **Running** en la consola de Lightsail"
              echo "2. La IP pública sigue siendo el secret \`LIGHTSAIL_HOST\`"
              echo "3. Networking → IPv4 → SSH (22) abierto a \`0.0.0.0/0\`"
              echo "4. Si el deploy anterior se cortó a mitad del Docker build, reiniciá la instancia y re-ejecutá el workflow"
              echo ""
              echo "Si el SSH sí conectó, buscá en el log la línea **>>>** (etapa) o \`::error\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-status:
    name: Deploy result
    needs: [compile, build-image, deploy-registry, deploy-fallback]
    if: always() && needs.compile.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar resultado final
        env:
          REG_OK: ${{ needs.deploy-registry.outputs.ok }}
          FB_OK: ${{ needs.deploy-fallback.outputs.ok }}
        run: |
          set -euo pipefail
          {
            echo "## Deploy result"
            if [ "${REG_OK}" = "true" ]; then
              echo "✅ Deploy OK vía **pull GHCR + blue/green** (la API vieja sigue hasta el health de la nueva)."
            elif [ "${FB_OK}" = "true" ]; then
              echo "✅ Deploy OK vía **fallback + blue/green** (build en Lightsail)."
              echo ""
              echo "El camino GHCR no completó; producción igual quedó actualizada."
            else
              echo "❌ Falló el deploy por GHCR y también el fallback local."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${REG_OK}" = "true" ] || [ "${FB_OK}" = "true" ]; then
            exit 0
          fi
          exit 1
